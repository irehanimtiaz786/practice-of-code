<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }

        #refer {
            border-radius: 50px;
            padding: 0 25px;
            width: 350px;
            height: 60px;
            font-size: 20px;
            border: 3px solid aquamarine;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        #refer:focus {
            box-shadow: 0 0 15px aquamarine;
            background: rgba(255, 255, 255, 0.2);
        }

        #refer::placeholder {
            color: rgba(127, 255, 212, 0.5);
        }

        #myList {
            list-style: none;
            width: 350px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }

        li {
            color: #2c3e50;
            background: aquamarine;
            margin-bottom: 10px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            animation: fadeIn 0.4s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <input type="text" name="refer" placeholder="Add a task..." id="refer">
    
    <ul id="myList"></ul>

 
</body>
</html>
<script>
    const refer = document.getElementById("refer");
    const ul = document.getElementById("myList");

    // . Add an event listener to listen for keystrokes in the input box
    refer.addEventListener("keydown", (event) => {
        
        // . Check if the key pressed was the "Enter" key
        if (event.key === "Enter" && refer.value.trim() !== "") {
            
            const li = document.createElement("li");
            
            //  Fill the <li> with the text from the input
            li.innerHTML = `<span>${refer.value}</span>`;
            
            // C. Attach the new <li> inside the <ul>
            ul.appendChild(li);
            
            // D. Clear the input box for the next word
            refer.value = "";
        }
    });
</script>
