<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
              margin: 0%;
              padding: 0%;
              box-sizing: border-box
       }

        #refer {
              border-radius: 50px;
              padding: 10px;
            width: 200px;
            height: 70px;
            font-size:20px;
        }
        li{
              color: aquamarine;
        }
        body {
              background: #422c36;
            display: flex;
            flex-direction: column; /* Stacks the input and list vertically */
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>
    
    <input type="text" name="refer" placeholder="type" id="refer">
    
    <ul id="myList"></ul>

    <script>
        const refer = document.getElementById("refer");
        const ul = document.getElementById("myList");

        // . Add an event listener to listen for keystrokes in the input box
        refer.addEventListener("keydown", (event) => {
            
            // . Check if the key pressed was the "Enter" key
            if (event.key === "Enter") {
                
                const li = document.createElement("li");
                
                //  Fill the <li> with the text from the input
                li.innerHTML = `<span>${refer.value}</span>`;
                
                // C. Attach the new <li> inside the <ul>
                ul.appendChild(li);
                
                // D. Clear the input box for the next word
                refer.value = "";
            }
        });
    </script>
</body>
</html>
